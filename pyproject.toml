[project]
name = "fisiogest"
version = "1.0.0"
description = "FisioGest - Sistema de gestión para consultorio de fisioterapia"
requires-python = ">=3.10"
authors = [
    { name = "Luis Santiago Taco Batson" },
    { name = "Josselyn Sofia Erique Robayo" },
]
dependencies = ["Flask>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: pruebas unitarias del dominio y casos de uso (sin base de datos ni HTTP)",
    "integration: pruebas de integración de adaptadores (SQLite, Flask)",
    "acceptance: pruebas de aceptación de flujos completos del usuario",
]

[tool.coverage.run]
source = ["src/fisiogest"]
omit = ["src/fisiogest/shared/infrastructure/seed.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# El formateador ajusta el código; las cadenas SQL y mensajes largos se permiten.
ignore = ["E501"]
