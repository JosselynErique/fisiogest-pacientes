{% with mensajes = get_flashed_messages(with_categories=true) %}
{% if mensajes %}
<div class="mensajes">
    {% for categoria, mensaje in mensajes %}
    <div class="alerta alerta-{{ categoria if categoria != 'message' else 'info' }}" role="status">{{ mensaje }}</div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
