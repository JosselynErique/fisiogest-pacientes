{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<section class="tarjeta tarjeta-centro">
    <p class="codigo-error">{{ codigo }}</p>
    <p>{{ mensaje }}</p>
    <a class="boton" href="{{ url_for('panel.ver') }}">Volver al inicio</a>
</section>
{% endblock %}
{% block publico %}
<section class="tarjeta tarjeta-login tarjeta-centro">
    <p class="codigo-error">{{ codigo }}</p>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <a class="boton" href="{{ url_for('iniciar_sesion.formulario') }}">Ir al inicio de sesión</a>
</section>
{% endblock %}
