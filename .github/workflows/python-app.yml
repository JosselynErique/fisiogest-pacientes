name: CI FisioGest

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Análisis estático (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Revisar estilo y errores comunes
        run: ruff check .

      - name: Verificar formato
        run: ruff format --check .

  pruebas:
    name: Pruebas automatizadas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: calidad
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas unitarias (dominio, casos de uso y arquitectura)
        run: pytest -m unit -v

      - name: Pruebas de integración (SQLite y HTTP)
        run: pytest -m integration -v

      - name: Pruebas de aceptación (flujo completo CP-06)
        run: pytest -m acceptance -v

      - name: Cobertura de código
        run: pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Publicar reporte de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  docker:
    name: Construcción de imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t fisiogest:ci .

      - name: Levantar contenedor y verificar /salud
        run: |
          docker run -d --name fisiogest -p 5000:5000 fisiogest:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:5000/salud; then echo; echo "FisioGest responde correctamente"; exit 0; fi
            sleep 1
          done
          docker logs fisiogest
          exit 1
